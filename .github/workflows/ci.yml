name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (web)
        run: pnpm --filter @tse/web type-check

      - name: Type check (backend)
        run: pnpm --filter @tse/backend type-check

      # Nothing invoked turbo's `lint` task before, so linter upgrades were
      # merging on a green tick that had never linted a single file.
      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm --filter @tse/web test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit   # only run E2E if unit tests pass
    # Blocking since 2026-07-12: runs against the stateful mock Medusa API in
    # e2e/global-setup.ts — deterministic, no DB, covers homepage/cart/products.

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @tse/web exec playwright install --with-deps chromium

      - name: Build Next.js app
        run: pnpm --filter @tse/web build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9001
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key

      - name: Run Playwright E2E tests
        run: pnpm --filter @tse/web test:e2e --project=chromium
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9001
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @tse/web build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key

      # Mirrors the prod Dockerfile's `medusa build` — catches admin-bundle
      # breakage (e.g. medusa version skew vs root pnpm overrides) pre-merge
      # instead of during the deploy on main.
      - name: Build backend (medusa)
        run: pnpm --filter @tse/backend build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  # Release gate: build the actual prod images so Dockerfile/context breakage
  # (e.g. the patches/ COPY incident) fails the release PR, not the deploy.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile --build-arg MEDUSA_BACKEND_URL=https://api.tse-cartridges.co.za .

      - name: Build web image
        run: >
          docker build -f apps/web/Dockerfile
          -t tse-web:ci
          --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.tse-cartridges.co.za
          --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=test-key
          --build-arg NEXT_PUBLIC_SITE_URL=https://tse-cartridges.co.za
          .

      # Building only proves it compiles. The standalone bundle can be missing a
      # dynamically-required module and still build perfectly clean — that shipped
      # twice (2026-08-29, 2026-09-09): the container exited 1 on start, failed the
      # deploy health check and took production down until rollback, with all of CI
      # green. #401 added this for the backend image; web was left build-only.
      - name: Boot web image and health-check
        run: |
          docker run -d --name web-ci -p 3000:3000 tse-web:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "✓ web image booted and answered /api/health"
              exit 0
            fi
            sleep 2
          done
          echo "✗ web image never became healthy — logs follow"
          docker logs web-ci
          exit 1
