name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (web)
        run: pnpm --filter @tse/web type-check

      - name: Type check (backend)
        run: pnpm --filter @tse/backend type-check

      - name: Unit tests with coverage
        run: pnpm --filter @tse/web test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit   # only run E2E if unit tests pass
    # Non-blocking: E2E needs a live backend + committed visual baselines that CI
    # doesn't yet provide. Runs and reports, but doesn't fail the pipeline.
    # TODO(e2e): stand up Medusa+Postgres (or mock the API), commit snapshot
    # baselines, fix stale selectors, then remove continue-on-error.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @tse/web exec playwright install --with-deps chromium

      - name: Build Next.js app
        run: pnpm --filter @tse/web build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9001
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key

      - name: Run Playwright E2E tests
        run: pnpm --filter @tse/web test:e2e --project=chromium
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9001
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright snapshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-snapshots
          path: apps/web/e2e/__snapshots__/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @tse/web build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key
