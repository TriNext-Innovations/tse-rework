name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (web)
        run: pnpm --filter @tse/web type-check

      - name: Type check (backend)
        run: pnpm --filter @tse/backend type-check

      # Nothing invoked turbo's `lint` task before, so linter upgrades were
      # merging on a green tick that had never linted a single file.
      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm --filter @tse/web test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit   # only run E2E if unit tests pass
    # Blocking since 2026-07-12: runs against the stateful mock Medusa API in
    # e2e/global-setup.ts — deterministic, no DB, covers homepage/cart/products.

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @tse/web exec playwright install --with-deps chromium

      - name: Build Next.js app
        run: pnpm --filter @tse/web build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9001
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key

      - name: Run Playwright E2E tests
        run: pnpm --filter @tse/web test:e2e --project=chromium
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9001
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @tse/web build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: test-key

      # Mirrors the prod Dockerfile's `medusa build` — catches admin-bundle
      # breakage (e.g. medusa version skew vs root pnpm overrides) pre-merge
      # instead of during the deploy on main.
      - name: Build backend (medusa)
        run: pnpm --filter @tse/backend build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  # Build the actual prod images so Dockerfile/context breakage (e.g. the
  # patches/ COPY incident) fails a PR rather than the deploy — and boot the
  # backend image, because building it proves nothing about whether it starts.
  #
  # Runs on PRs into develop as well as main. Features merge into develop, so
  # gating only the release PR would catch a broken image once everything is
  # already batched, when the cheap moment to catch it is the feature PR that
  # introduced it.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')

    env:
      IMAGE: tse-backend:ci
      CI_NETWORK: tse-ci
      SMOKE_DATABASE_URL: postgresql://postgres:smoke@postgres-ci:5432/tse_medusa_ci?sslmode=disable
      SMOKE_REDIS_URL: redis://redis-ci:6379

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t "$IMAGE" --build-arg MEDUSA_BACKEND_URL=https://api.tse-cartridges.co.za .

      # Throwaway Postgres + Redis on a user-defined network so the smoke
      # container reaches them by name. Deliberately `docker run` rather than
      # `services:` — service containers are only reachable from the job via
      # published ports on the runner host, and the smoke container needs to
      # be on the same network as them, exactly as it is in prod-deploy.sh.
      - name: Start throwaway Postgres + Redis
        run: |
          docker network create "$CI_NETWORK"
          docker run -d --name postgres-ci --network "$CI_NETWORK" \
            -e POSTGRES_DB=tse_medusa_ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=smoke \
            --health-cmd "pg_isready -U postgres -d tse_medusa_ci" \
            --health-interval 5s --health-retries 20 \
            postgres:16-alpine
          docker run -d --name redis-ci --network "$CI_NETWORK" \
            --health-cmd "redis-cli ping" \
            --health-interval 5s --health-retries 20 \
            redis:7-alpine
          for c in postgres-ci redis-ci; do
            for _ in $(seq 1 40); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = healthy ] && break
              sleep 3
            done
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = healthy ] \
              || { echo "::error::$c never became healthy"; docker logs "$c"; exit 1; }
          done

      # Medusa only reaches route registration against a migrated database, so
      # an unmigrated DB would fail the smoke test for the wrong reason. Only
      # `db:migrate` runs here, not docker-migrate-entrypoint.sh — the seed and
      # data-backfill scripts in that entrypoint are about data correctness, and
      # this gate is about whether the image boots. The dummy R2_* values are
      # required because medusa-config.ts registers @medusajs/file-s3
      # unconditionally and it throws at load without credentials (see #372).
      - name: Run migrations against the throwaway DB
        run: |
          docker run --rm --network "$CI_NETWORK" \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e REDIS_URL="$SMOKE_REDIS_URL" \
            -e JWT_SECRET=smoke-test \
            -e COOKIE_SECRET=smoke-test \
            -e R2_ACCESS_KEY_ID=smoke -e R2_SECRET_ACCESS_KEY=smoke -e R2_BUCKET=smoke \
            -e R2_ENDPOINT=http://127.0.0.1:9999 -e R2_PUBLIC_URL=http://127.0.0.1:9999 \
            -e NODE_ENV=production \
            --entrypoint /app/node_modules/.bin/medusa \
            "$IMAGE" db:migrate

      # `docker build` exiting 0 says nothing about whether medusa starts:
      # src/api/** compiles at RUNTIME. A green image crash-looped in prod on
      # 2026-08-06 (502 for ~3 min). This is that gate.
      - name: Smoke test — the backend image must actually boot
        run: scripts/smoke-backend-image.sh "$IMAGE" --network "$CI_NETWORK" --timeout 300

      - name: Tear down throwaway services
        if: always()
        run: |
          docker rm -f postgres-ci redis-ci >/dev/null 2>&1 || true
          docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true

      - name: Build web image
        run: >
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.tse-cartridges.co.za
          --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=test-key
          --build-arg NEXT_PUBLIC_SITE_URL=https://tse-cartridges.co.za
          .
