name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy — wait for it

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e

            cd /opt/tse-ui

            echo "▶ Working-tree status before deploy"
            git status --short || true

            echo "▶ Local changes that diverge from the committed tree (captured for the record):"
            git diff || true

            # A manual hotfix left uncommitted on the box will make `git pull`
            # abort. Preserve any such tracked changes in a stash (recoverable via
            # `git stash list` / `git stash show -p`) so the checkout can proceed
            # cleanly without ever destroying work. Note: no `-u` — untracked
            # files (e.g. the root-owned nginx SSL key) can't always be read and
            # would abort the stash; `git reset --hard` below never touches them.
            echo "▶ Stashing any local tracked changes so the checkout can fast-forward"
            git stash push -m "auto-stash before deploy $(date -u +%FT%TZ)" || echo "  (nothing to stash)"

            echo "▶ Fetching and resetting to origin/main"
            git fetch origin main
            git reset --hard origin/main

            echo "▶ Building and starting containers"
            docker compose pull --quiet
            docker compose up --build -d --remove-orphans

            echo "▶ Waiting for services to stabilise (30s)"
            sleep 30

            # Recreated web/medusa containers get new docker-network IPs, but
            # nginx's static upstreams resolve them once at load — reload so it
            # re-resolves, otherwise the public site 502s while checks pass.
            echo "▶ Reloading nginx to pick up new container IPs"
            docker compose exec -T nginx nginx -s reload

            echo "▶ Health check — Medusa (direct)"
            curl -sf http://localhost:9000/health || { echo "✗ Medusa health check failed"; exit 1; }

            echo "▶ Health check — Next.js (direct)"
            curl -sf http://localhost:3000/api/health || { echo "✗ Next.js health check failed"; exit 1; }

            # Through nginx via the public URLs — this is what customers hit; a
            # 502 here must fail the deploy instead of passing silently.
            echo "▶ Health check — storefront via nginx"
            curl -sfo /dev/null --retry 3 --retry-delay 5 --retry-all-errors https://tse-cartridges.co.za \
              || { echo "✗ Public storefront check failed (nginx path)"; exit 1; }

            echo "▶ Health check — API via nginx"
            curl -sfo /dev/null --retry 3 --retry-delay 5 --retry-all-errors https://api.tse-cartridges.co.za/health \
              || { echo "✗ Public API check failed (nginx path)"; exit 1; }

            # /products is SSR against Medusa+Postgres, so this one curl proves
            # the whole read path (nginx → next → medusa → db) end to end.
            echo "▶ Health check — product listing via nginx (SSR → Medusa → DB)"
            curl -sfo /dev/null --retry 3 --retry-delay 5 --retry-all-errors https://tse-cartridges.co.za/products \
              || { echo "✗ Product listing check failed"; exit 1; }

            echo "✓ Deploy complete"

      - name: Notify on failure (rollback prompt)
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e

            cd /opt/tse-ui

            echo "▶ Deploy failed — rolling back to previous images"
            # Re-start whatever was running before the failed build
            docker compose up -d

            echo "▶ Reloading nginx after rollback"
            docker compose exec -T nginx nginx -s reload || echo "⚠ nginx reload failed"

            echo "▶ Post-rollback health checks"
            sleep 15
            curl -sf http://localhost:9000/health || echo "⚠ Medusa still unhealthy after rollback"
            curl -sf http://localhost:3000/api/health || echo "⚠ Next.js still unhealthy after rollback"
            curl -sfo /dev/null https://tse-cartridges.co.za || echo "⚠ Public storefront still unhealthy after rollback"
