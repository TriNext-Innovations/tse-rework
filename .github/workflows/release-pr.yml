name: Release PR

# Keeps a rolling release/* → main PR open with a changelog. A human merges it,
# and that push is what deploys.
#
# This workflow NEVER deploys and never merges anything itself. It used to
# auto-merge and dispatch a deploy when a release looked Dependabot-only, and
# on 2026-08-29 that shipped a human's merge commit to production unreviewed.
# Releases are now always a deliberate human action.

on:
  push:
    branches: ['release/**']

concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or refresh the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --quiet
          BRANCH="${GITHUB_REF_NAME}"
          COMMITS=$(git log origin/main..HEAD --no-merges --pretty='- %s')
          if [ -z "$COMMITS" ]; then
            echo "$BRANCH and main are level — nothing to release"
            exit 0
          fi

          BODY=$(printf '**Changes since main:**\n\n%s\n\n**Merging this PR deploys to production.** Auto-rollback and public health checks guard it, but the decision to ship is yours — nothing here merges itself.\n\n🤖 Rolling release PR — auto-updated on every push to `%s`.' "$COMMITS" "$BRANCH")

          PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            URL=$(gh pr create --base main --head "$BRANCH" \
              --title "release: $BRANCH → main" \
              --body "$BODY")
            PR=$(basename "$URL")
          else
            gh pr edit "$PR" --body "$BODY"
          fi
