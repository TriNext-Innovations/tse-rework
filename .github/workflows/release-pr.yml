name: Release PR

# Keeps a rolling develop → main release PR open with a changelog. A human
# merges it with one click (that push triggers deploy.yml normally).
# Exception: when everything since main is Dependabot's, the release ships
# itself — wait for the PR checks, merge, then explicitly dispatch the deploy
# (a GITHUB_TOKEN merge push does NOT trigger push-event workflows).

on:
  push:
    branches: [develop]

concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or refresh the release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --quiet
          COMMITS=$(git log origin/main..HEAD --no-merges --pretty='- %s')
          if [ -z "$COMMITS" ]; then
            echo "develop and main are level — nothing to release"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(printf '**Changes since main:**\n\n%s\n\nMerging this PR deploys to production (auto-rollback + public health checks guard it).\n\n🤖 Rolling release PR — auto-updated on every develop push.' "$COMMITS")

          PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            URL=$(gh pr create --base main --head develop \
              --title "release: develop → main" \
              --body "$BODY")
            PR=$(basename "$URL")
          else
            gh pr edit "$PR" --body "$BODY"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          # Auto-shipping skips human review, so it must fail closed. Two
          # independent gates, both of which have to pass.
          #
          # Gate 1 — authorship, INCLUDING merge commits. This used to pass
          # --no-merges, which made a human merge commit invisible: on
          # 2026-08-29 a `git merge main` into develop was classified
          # Dependabot-only, so the release self-merged and deployed with no
          # human involved. Match on the author email rather than the display
          # name, which anyone can set to anything.
          AUTHORS=$(git log origin/main..HEAD --pretty='%ae' | sort -u)
          NON_BOT=$(printf '%s\n' "$AUTHORS" | grep -vE '(^|\+)dependabot(\[bot\])?@' || true)

          # Gate 2 — the diff itself. Even if authorship somehow says bot, a
          # release touching application code must never ship unreviewed.
          # Dependabot only edits manifests, the lockfile and workflow pins.
          OFFENDING=$(git diff --name-only origin/main..HEAD \
            | grep -vE '(^|/)package\.json$|^pnpm-lock\.yaml$|^\.github/workflows/[^/]+\.ya?ml$' || true)

          if [ -z "$NON_BOT" ] && [ -z "$OFFENDING" ]; then
            echo "deps_only=true" >> "$GITHUB_OUTPUT"
            echo "Release is Dependabot-only by both authorship and diff — eligible to auto-ship"
          else
            echo "deps_only=false" >> "$GITHUB_OUTPUT"
            echo "Not auto-shipping — needs a human to merge."
            [ -n "$NON_BOT" ] && echo "  non-Dependabot authors: $(printf '%s' "$NON_BOT" | tr '\n' ' ')"
            [ -n "$OFFENDING" ] && echo "  non-dependency files changed: $(printf '%s' "$OFFENDING" | head -5 | tr '\n' ' ')"
          fi

      - name: Auto-ship Dependabot-only releases
        if: steps.pr.outputs.deps_only == 'true' && steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.pr.outputs.pr }}
          echo "Release is Dependabot-only — waiting for checks on PR #$PR"
          gh pr checks "$PR" --watch --required --interval 30
          gh pr merge "$PR" --merge
          echo "Merged — dispatching production deploy"
          gh workflow run deploy.yml --ref main