version: 2

updates:
  # ── Root workspace ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    groups:
      medusa:
        patterns:
          - "@medusajs/*"
      dev-tooling:
        patterns:
          - "turbo"
          - "typescript"
          - "@types/*"
    ignore:
      # Runtime is Node 20 (node:20-alpine images) — typings must not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "automerge"

  # ── Web (Next.js storefront) ─────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # Runtime is Node 20 (node:20-alpine images) — typings must not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "automerge"

  # ── Backend (Medusa) ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    groups:
      medusa:
        patterns:
          - "@medusajs/*"
    ignore:
      # Runtime is Node 20 (node:20-alpine images) — typings must not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "automerge"

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    labels:
      - "dependencies"
      - "automerge"
