version: 2

# One npm entry only, deliberately.
#
# This is a pnpm workspace with a single root `pnpm-lock.yaml`. Dependabot can
# only update a lockfile that lives in the directory it is pointed at, so
# per-app entries (`/apps/web`, `/apps/backend`) raised PRs that edited
# `apps/*/package.json` and nothing else — every one of them then failed CI at
# `pnpm install --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE. They could
# not be rebased green; the config produced them broken. Ten PRs accumulated
# that way between 11 July and 4 August.
#
# The root entry sees every workspace package, so the groups below still cover
# apps/web, apps/backend and packages/* — they just arrive with a lockfile.

updates:
  # ── Whole workspace (root lockfile) ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: Africa/Johannesburg
    # Groups take patch bumps only, so a group PR is all-patch and can merge
    # itself; minor bumps arrive one dependency per PR for a human.
    groups:
      medusa:
        patterns:
          - "@medusajs/*"
        update-types: ["patch"]
      dev-tooling:
        patterns:
          - "turbo"
          - "typescript"
          - "@types/*"
        update-types: ["patch"]
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types: ["patch"]
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
        update-types: ["patch"]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["patch"]
    ignore:
      # Runtime is Node 20 (node:20-alpine images) — typings must not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) ships no compiler API: ts-node, which
      # `medusa exec` uses to run scripts on prod, crashes on it, and so do the
      # Medusa build and typescript-eslint (peer <6.1). Tried 16 Oct 2026 (#520).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom 30 needs Node >=22.22; vitest workers die on Node 20. Lift with
      # the Node upgrade.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # Medusa upgrades are never routine here: the @medusajs/dashboard patch is
      # pinned to an exact version, the root overrides pin admin-sdk/admin-shared
      # to match, and minor bumps have changed query load-strategy behaviour under
      # the order and payment-capture subscribers. Minor is not safe to automerge,
      # and semver-minor bumps would otherwise qualify. Bump these by hand.
      - dependency-name: "@medusajs/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
    # Release branches are retired (2 Nov 2026): updates target main, the default,
    # and a merge to main is a production deploy. deps-nightly-merge.yml merges
    # semver-patch bumps with every check green between 01:00 and 04:00 SAST
    # (Ryno, 12 Nov 2026, trinext-ai-hive#16), and only once the repo variable
    # DEPS_AUTOMERGE is "on" — which waits for full-stack customer-flow E2E (#571).
    # DEPS_DENY keeps @medusajs/*, next and react manual regardless.

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: Africa/Johannesburg
    labels:
      - "dependencies"
    # Release branches are retired (2 Nov 2026): updates target main, the default,
    # and a merge to main is a production deploy. deps-nightly-merge.yml merges
    # semver-patch bumps with every check green between 01:00 and 04:00 SAST
    # (Ryno, 12 Nov 2026, trinext-ai-hive#16), and only once the repo variable
    # DEPS_AUTOMERGE is "on" — which waits for full-stack customer-flow E2E (#571).
    # DEPS_DENY keeps @medusajs/*, next and react manual regardless.
