# ── Upstream definitions ───────────────────────────────────────────────────
upstream nextjs {
    server web:3000;
}
upstream medusa {
    server medusa:9000;
}
upstream meilisearch {
    server meilisearch:7700;
}
upstream bugsink {
    server bugsink:8000;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
# The storefront hosts go straight to https://www.tse.co.za (#438) — one hop,
# not http → https://tse-cartridges → www.tse.co.za. The API keeps its host.
server {
    listen 80;
    server_name tse-cartridges.co.za www.tse-cartridges.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.tse.co.za$request_uri;
    }
}

server {
    listen 80;
    server_name api.tse-cartridges.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Default server — unmatched hostnames ──────────────────────────────────
# Explicit so no real vhost is ever the accidental fallback. Previously the
# dev.* blocks sat here and handed their (now expired) cert to anything that
# matched nothing — which is how www.* returned a Cloudflare 526.
# dev.tse-cartridges.co.za and api.dev.* were removed: their DNS is gone and
# their cert expired 2026-08-18 with no path to renew.
server {
    listen 443 ssl default_server;
    http2  on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/origin-cf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/origin-cf/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 444;
}

# ── www.tse-cartridges.co.za → www.tse.co.za 301 ─────────────────────────
# Straight to the canonical host (#438), not via the old apex.
# Without this block www.* matched no server_name and fell through to the
# first 443 block (dev.*), which served an expired dev cert → Cloudflare 526.
# Uses the Cloudflare Origin CA cert (*.tse-cartridges.co.za, valid to 2041)
# because the Let's Encrypt apex cert has no www SAN.
server {
    listen 443 ssl;
    http2  on;
    server_name www.tse-cartridges.co.za;

    ssl_certificate     /etc/letsencrypt/origin-cf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/origin-cf/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://www.tse.co.za$request_uri;
}

# ── tse-cartridges.co.za → www.tse.co.za 301 (#438) ───────────────────────
# The storefront moved to www.tse.co.za (decision #13, live 2026-09-28). This
# host stays registered and answering as a permanent, path-preserving 301 so
# existing links and bookmarks keep working. The paths here are new-store
# paths, so the legacy WooCommerce map does not apply — $request_uri as-is.
#
# Two exceptions stay served, not redirected:
#  - /meili/ — the web image is built with
#    NEXT_PUBLIC_MEILISEARCH_HOST=https://tse-cartridges.co.za/meili, so
#    browser search on www.tse.co.za calls this host. Redirecting it would
#    break storefront search. Remove once the image is rebuilt against
#    https://www.tse.co.za/meili (already proxied in tse-co-za.conf).
#  - /.well-known/acme-challenge/ — webroot renewals of this host's cert.
server {
    listen 443 ssl;
    http2  on;
    server_name tse-cartridges.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    ssl_certificate     /etc/letsencrypt/live/tse-cartridges.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tse-cartridges.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    location /meili/ {
        proxy_pass         http://meilisearch/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://www.tse.co.za$request_uri;
    }
}

# ── Medusa API — api.tse-cartridges.co.za (apex, PROD) → Medusa :9000 ──────
server {
    listen 443 ssl;
    http2  on;
    server_name api.tse-cartridges.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Apex SAN cert covers both tse-cartridges.co.za and api.tse-cartridges.co.za;
    # it is stored under live/tse-cartridges.co.za/ (first -d name), so both apex
    # server blocks reference that path — not a live/api.tse-cartridges.co.za/ dir.
    ssl_certificate     /etc/letsencrypt/live/tse-cartridges.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tse-cartridges.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # The Medusa API sets no security headers of its own — add them at the edge.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    client_max_body_size 20m;

    # Bugsink error ingestion (browser Sentry SDK). Only the /api/ surface is
    # public — the Bugsink UI stays loopback-only on the VM (ssh -L 8100).
    # DSN path prefix: https://<key>@api.tse-cartridges.co.za/bugsink/<project>
    # → SDK posts to /bugsink/api/<project>/envelope/ → stripped to /api/....
    location /bugsink/api/ {
        proxy_pass         http://bugsink/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://medusa;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
