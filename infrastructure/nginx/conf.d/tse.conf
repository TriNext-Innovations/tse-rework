# ── Upstream definitions ───────────────────────────────────────────────────
# Dev containers (inside docker network)
upstream nextjs {
    server web:3000;
}
upstream medusa {
    server medusa:9000;
}

# Prod containers (docker-compose.prod.yml — exposed on host ports 3001/9001)
upstream nextjs_prod {
    server host.docker.internal:3001;
}
upstream medusa_prod {
    server host.docker.internal:9001;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    server_name dev.tse-cartridges.co.za api.dev.tse-cartridges.co.za
                tse-cartridges.co.za api.tse-cartridges.co.za;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Storefront — dev.tse-cartridges.co.za → Next.js :3000 ────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name dev.tse-cartridges.co.za;

    ssl_certificate     /etc/ssl/cloudflare/tse-cartridges.co.za.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tse-cartridges.co.za.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    location / {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Medusa API — api.dev.tse-cartridges.co.za → Medusa :9000 ─────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name api.dev.tse-cartridges.co.za;

    ssl_certificate     /etc/ssl/cloudflare/tse-cartridges.co.za.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tse-cartridges.co.za.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://medusa;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

