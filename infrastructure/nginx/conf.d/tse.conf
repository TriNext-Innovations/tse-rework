# ── Upstream definitions ───────────────────────────────────────────────────
upstream nextjs {
    server web:3000;
}
upstream medusa {
    server medusa:9000;
}
upstream meilisearch {
    server meilisearch:7700;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    server_name dev.tse-cartridges.co.za api.dev.tse-cartridges.co.za tse-cartridges.co.za api.tse-cartridges.co.za;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Legacy dev hosts — 301 to the apex (#192 post-launch cleanup) ──────────
# The app no longer functions on dev.* (CORS + baked NEXT_PUBLIC_* are
# apex-only); keep the certs so HTTPS still answers, but redirect everything.
server {
    listen 443 ssl;
    http2  on;
    server_name dev.tse-cartridges.co.za;

    ssl_certificate     /etc/letsencrypt/live/dev.tse-cartridges.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.tse-cartridges.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://tse-cartridges.co.za$request_uri;
}

server {
    listen 443 ssl;
    http2  on;
    server_name api.dev.tse-cartridges.co.za;

    ssl_certificate     /etc/letsencrypt/live/api.dev.tse-cartridges.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.tse-cartridges.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://api.tse-cartridges.co.za$request_uri;
}

# ── Storefront — tse-cartridges.co.za (apex, PROD) → Next.js :3000 ─────────
server {
    listen 443 ssl;
    http2  on;
    server_name tse-cartridges.co.za;

    ssl_certificate     /etc/letsencrypt/live/tse-cartridges.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tse-cartridges.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    location /meili/ {
        proxy_pass         http://meilisearch/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Medusa API — api.tse-cartridges.co.za (apex, PROD) → Medusa :9000 ──────
server {
    listen 443 ssl;
    http2  on;
    server_name api.tse-cartridges.co.za;

    # Apex SAN cert covers both tse-cartridges.co.za and api.tse-cartridges.co.za;
    # it is stored under live/tse-cartridges.co.za/ (first -d name), so both apex
    # server blocks reference that path — not a live/api.tse-cartridges.co.za/ dir.
    ssl_certificate     /etc/letsencrypt/live/tse-cartridges.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tse-cartridges.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # The Medusa API sets no security headers of its own — add them at the edge.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://medusa;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
