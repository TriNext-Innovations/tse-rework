<!doctype html>
<!-- Holding page for www.tse.co.za (#547). Served by nginx as a 503 when the
     storefront upstream is down. Generated from tnx-maintenance src/page.html
     with the "tse" entry of sites.json (5c17eee): change it there first, then
     copy it here. Inline only: no external requests, it stands in for the origin. -->
<html lang="en" data-site="tse">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TSE Online — back shortly</title>
<style>
  :root{--bg:#0A0A0A;--fg:#F2F4F5;--muted:#8A9296;--accent:#41E0F5;--line:#2A2A2A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--fg);
       font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .card{width:100%;max-width:33rem;text-align:center}
  .mark{width:52px;height:52px;margin:0 auto 28px;border-radius:14px;
        display:grid;place-items:center;background:var(--accent);
        color:var(--bg);font-weight:700;font-size:20px;letter-spacing:.02em}
  h1{margin:0 0 14px;font-size:clamp(1.5rem,4.5vw,2.05rem);line-height:1.25;letter-spacing:-.02em}
  p{margin:0 auto;max-width:30rem;color:var(--muted)}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;
         background:var(--accent);margin-right:9px;vertical-align:middle;
         animation:p 2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  .foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);
        font-size:13.5px;color:var(--muted)}
  @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">TSE</div>
    <h1>We’re undergoing technical maintenance</h1>
    <p><span class="pulse"></span>The site will be back shortly. Nothing you’ve bought or submitted is affected.</p>
    <p class="foot">TSE Online · If it’s urgent, reach us at sales@tse.co.za</p>
  </main>
</body>
</html>
