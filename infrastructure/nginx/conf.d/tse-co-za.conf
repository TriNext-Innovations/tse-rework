# ── Storefront on www.tse.co.za (decision #13, canonical host #475) ───────
#
# LIVE since 2026-09-28 (cutover #442). Enabled on the box by hand at the
# flip and tracked under this name since 2026-09-29, so the repo matches prod.
#
# Rebuilding a box from scratch: this file needs /etc/letsencrypt/live/tse.co.za
# to exist, or nginx refuses to start and takes every site down with it. Rename
# it to .disabled, bring nginx up with tse-co-za-bootstrap.conf enabled, issue
# the cert by HTTP-01, then swap back → nginx -t → reload.
# See docs/CUTOVER-EXECUTION-2026-09-23.md.
#
# This REPLACES legacy-tse-co-za.conf.disabled, which implemented the opposite
# direction (#8: tse.co.za 301s away to tse-cartridges.co.za). Under #13
# tse.co.za serves the storefront and tse-cartridges.co.za redirects into it.
#
# The canonical host is WWW, not the apex (#475, decided 2026-09-25). The old
# site canonicalises apex → www and its sitemap lists only www URLs, so every
# indexed URL is already on www. Serving www keeps the migration a path change
# only. Every other variant (http, apex) goes to https://www in ONE hop,
# straight to the legacy map target where there is one.
#
# tse.co.za is NOT behind Cloudflare — its nameservers stay at GAM and the A
# record points straight at this box. So unlike the tse-cartridges.co.za
# blocks, there is no Cloudflare Origin CA cert and no edge in front: this
# needs a publicly-trusted Let's Encrypt cert, and the origin takes traffic
# raw. Security headers still come from Next (next.config.ts sets HSTS, CSP
# and the rest on every route), so they are not repeated here.

# ── Holding page eligibility (#547) ───────────────────────────────────────
# Only reads get the branded holding page. A write (checkout, server action,
# form POST) keeps whatever the upstream or nginx said, body and all: the
# client that sent it parses that response, and swapping it for HTML would
# hide the real outcome. Same rule as the house Worker since 287fcee ("time
# out reads only, never a write"). Maps live at http level; conf.d is
# included inside http {}.
map $request_method $tse_holding_eligible {
    GET     1;
    HEAD    1;
    default 0;
}

# ── HTTP → HTTPS, plus the ACME webroot for renewals ──────────────────────
server {
    listen 80;
    server_name tse.co.za www.tse.co.za;

    # First issuance uses tse-co-za-bootstrap.conf.disabled before this file
    # is enabled. This location serves subsequent webroot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Straight to the final https://www URL. Going via https://$host would
    # cost legacy http:// and apex links a second hop.
    location / {
        if ($legacy_target) {
            return 301 https://www.tse.co.za$legacy_target;
        }
        return 301 https://www.tse.co.za$request_uri;
    }
}

# ── apex → www ────────────────────────────────────────────────────────────
# Mirrors what the legacy site has always done. The certificate carries both
# names, so this block can use it directly.
server {
    listen 443 ssl;
    http2  on;
    server_name tse.co.za;

    ssl_certificate     /etc/letsencrypt/live/tse.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tse.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Resolve the legacy map here too, straight to the final target, rather
    # than bouncing to www and redirecting a second time. One hop, not two.
    if ($legacy_target) {
        return 301 https://www.tse.co.za$legacy_target;
    }

    return 301 https://www.tse.co.za$request_uri;
}

# ── Storefront — www.tse.co.za → Next.js :3000 ────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name www.tse.co.za;

    ssl_certificate     /etc/letsencrypt/live/tse.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tse.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # Legacy WooCommerce URLs, now a SAME-HOST restructure rather than a
    # cross-domain move — which is the whole point of #13. $legacy_target is
    # defined in 00-legacy-redirects.conf (832 URLs, every target asserted to
    # be a live route at generation time).
    #
    # Safe to evaluate ahead of the proxy: the two URL namespaces were checked
    # for collisions and there are none. Legacy uses /product/ and
    # /product-category/; the new store uses /products/ and /cartridges/. So
    # this can never shadow a real storefront route.
    #
    # The map keys on $uri, so query strings are dropped deliberately — legacy
    # cart and filter URLs carry nothing worth preserving.
    if ($legacy_target) {
        return 301 https://www.tse.co.za$legacy_target;
    }

    location /meili/ {
        proxy_pass         http://meilisearch/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Branded holding page when the storefront is down (#547) ─────────────
    # tse.co.za has no Cloudflare in front (DNS is at GAM), so the house
    # maintenance Worker cannot cover it. This covers the common case — the
    # Next.js container crashed, restarting, or mid-deploy — from the origin.
    # It CANNOT cover the box, Docker or nginx itself being down: that still
    # shows a browser connection error. tse.co.za DNS stays at GAM (decision
    # 18 Nov 2026), so that residual risk is accepted.
    #
    # Inline-only page (no external requests), 503 + Retry-After so crawlers
    # keep rankings, no-store so it never outlives the outage. The file sits in
    # conf.d/holding/ so it rides the existing conf.d directory mount: no
    # compose change, picked up by a reload. `include conf.d/*.conf` does not
    # recurse, so nothing in holding/ is ever parsed as config.
    location = /__maintenance.html {
        internal;
        alias /etc/nginx/conf.d/holding/www-tse-co-za.html;
        default_type text/html;
        charset utf-8;
        etag off;
        # `always`: add_header skips 503 otherwise.
        add_header Cache-Control "no-store" always;
        add_header Retry-After   "600"      always;
    }

    # Next.js API routes (/api/health today) are machine clients: monitors and
    # the deploy's health check parse the status and body. No interception —
    # the app's own 5xx passes through untouched, and an nginx-generated
    # 502/504 (upstream down) stays a plain error, never an HTML page.
    location /api/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        # Upstream down (connection refused → 502), timed out (504), or the app
        # itself answering 502/503/504 → holding page as 503, reads only.
        # proxy_intercept_errors only acts on codes that have an error_page, so
        # 404, 500 and every other app response still pass through untouched
        # (Next renders its own branded 404/500). Writes get no error_page at
        # all — see $tse_holding_eligible above. error_page is one of the few
        # directives that is safe inside `if` in a location.
        proxy_intercept_errors on;
        if ($tse_holding_eligible) {
            error_page 502 503 504 =503 /__maintenance.html;
        }

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
