services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: tse_medusa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bind to loopback only — Docker's port publishing bypasses UFW, so a plain
    # "5432:5432" exposes Postgres to the public internet. nginx/medusa reach it
    # by service name over the compose network; localhost keeps box-local tools.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tse_medusa"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password + loopback-only publishing. Without this Redis was reachable
    # unauthenticated on the public IP (Docker bypasses UFW) — a known RCE
    # vector. medusa connects over the compose network using REDIS_URL's creds.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 100m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  medusa-migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/tse_medusa?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NODE_OPTIONS: "--max-old-space-size=1536"
      MEDUSA_WORKER_MODE: "server"
      MEDUSA_DISABLE_TELEMETRY: "1"
      # medusa exec (compat scripts in the entrypoint) boots the full app,
      # which loads the file-s3 provider — needs R2 creds.
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    entrypoint: ["/app/apps/backend/docker-migrate-entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  medusa:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        # Bake the public API URL into the admin dashboard build.
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      medusa-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started, not service_healthy: the meili image has no
      # wget/curl so its healthcheck never passes, though search works.
      meilisearch:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/tse_medusa?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      STOREFRONT_URL: ${STOREFRONT_URL}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      ZEPTOMAIL_TOKEN: ${ZEPTOMAIL_TOKEN}
      EMAIL_FROM: ${EMAIL_FROM:-sales@tse-cartridges.co.za}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-sales@tse.co.za}
      # Team inbox for ALL backend notifications (#271, replaces TSE_NOTIFY_EMAIL).
      # SALES_CC copies extra inboxes (comma-separated) on every team notification.
      SALES_EMAIL: ${SALES_EMAIL:-sales@tse.co.za}
      SALES_CC: ${SALES_CC:-}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      # Shared secret guarding the server-to-server PayFast pending/capture routes
      PAYFAST_CAPTURE_SECRET: ${PAYFAST_CAPTURE_SECRET}
      # Order-capture targets (defaults in code match dev; override per env)
      MEDUSA_ZAR_REGION_ID: ${MEDUSA_ZAR_REGION_ID:-}
      MEDUSA_SALES_CHANNEL_ID: ${MEDUSA_SALES_CHANNEL_ID:-}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      # The Courier Guy (ShipLogic) fulfillment provider
      TCG_API_KEY: ${TCG_API_KEY}
      TCG_API_URL: ${TCG_API_URL:-}
      TCG_COLLECTION_STREET: ${TCG_COLLECTION_STREET}
      TCG_COLLECTION_LOCAL_AREA: ${TCG_COLLECTION_LOCAL_AREA}
      TCG_COLLECTION_CITY: ${TCG_COLLECTION_CITY}
      TCG_COLLECTION_ZONE: ${TCG_COLLECTION_ZONE}
      TCG_COLLECTION_COUNTRY: ${TCG_COLLECTION_COUNTRY}
      TCG_COLLECTION_CODE: ${TCG_COLLECTION_CODE}
      TCG_COLLECTION_COMPANY: ${TCG_COLLECTION_COMPANY}
      TCG_COLLECTION_CONTACT_NAME: ${TCG_COLLECTION_CONTACT_NAME}
      TCG_COLLECTION_CONTACT_PHONE: ${TCG_COLLECTION_CONTACT_PHONE}
      TCG_COLLECTION_CONTACT_EMAIL: ${TCG_COLLECTION_CONTACT_EMAIL}
      TCG_DEFAULT_LENGTH_CM: ${TCG_DEFAULT_LENGTH_CM:-22}
      TCG_DEFAULT_WIDTH_CM: ${TCG_DEFAULT_WIDTH_CM:-11}
      TCG_DEFAULT_HEIGHT_CM: ${TCG_DEFAULT_HEIGHT_CM:-6}
      TCG_DEFAULT_WEIGHT_KG: ${TCG_DEFAULT_WEIGHT_KG:-0.5}
      TCG_RATE_TAX_INCLUSIVE: ${TCG_RATE_TAX_INCLUSIVE:-true}
      TCG_TRACKING_URL_TEMPLATE: ${TCG_TRACKING_URL_TEMPLATE:-https://www.thecourierguy.co.za/track?ref={ref}}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    # Loopback-only — nginx proxies api.dev → medusa:9000 over the compose
    # network. Publishing on 0.0.0.0 exposed the API over plain HTTP (no TLS).
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* must be baked into the client bundle at build time.
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MEILISEARCH_HOST: ${NEXT_PUBLIC_MEILISEARCH_HOST}
        NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: ${NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        # Route checkout through the Medusa PayFast provider (canonical flow).
        # Default off — set NEXT_PUBLIC_PAYFAST_PROVIDER=true in the VM .env to
        # activate (sandbox first). Baked into the client bundle at build time.
        NEXT_PUBLIC_PAYFAST_PROVIDER: ${NEXT_PUBLIC_PAYFAST_PROVIDER:-false}
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL:-http://medusa:9000}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://medusa:9000}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MEILISEARCH_HOST: ${NEXT_PUBLIC_MEILISEARCH_HOST}
      NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: ${NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ORG: ${SENTRY_ORG}
      SENTRY_PROJECT: ${SENTRY_PROJECT}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      PAYFAST_CAPTURE_SECRET: ${PAYFAST_CAPTURE_SECRET}
    # Loopback-only — nginx proxies dev. → web:3000 over the compose network.
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 350m
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 but
      # Next's standalone server listens on IPv4 0.0.0.0 only → false unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Bugsink — self-hosted Sentry-compatible error tracking ────────────────
  # Server-side SDKs post over the compose network (SENTRY_DSN =
  # http://<key>@bugsink:8000/<project>); browser events arrive via the nginx
  # `/bugsink/api/` path on the api host. UI is loopback-only — reach it with
  # `ssh -L 8100:localhost:8100 linuxuser@<vm>` → http://localhost:8100.
  bugsink:
    image: bugsink/bugsink:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      # Matches how the UI is actually reached (SSH tunnel) so login/CSRF work.
      BASE_URL: http://localhost:8100
      SINGLE_TEAM: "True"
      USER_REGISTRATION: CB_ADMINS
      # Set once in .env for first boot (email:password), remove afterwards.
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER:-}
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - bugsink_data:/data
    deploy:
      resources:
        limits:
          memory: 400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - medusa
      - bugsink
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      # Let's Encrypt certs (tse.conf references /etc/letsencrypt/live/...).
      # The dev domains are DNS-only (direct to origin), so they need a
      # publicly-trusted cert, not a Cloudflare origin cert.
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 50m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  certbot_certs:
  certbot_www:
  bugsink_data:
